[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "task-offloading-new-arch"
version = "0.1.0"
description = "Validated simulation core for semantic-aware MEC task offloading research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "gymnasium>=1.1,<2",
  "jsonschema>=4.23,<5",
  "numpy>=2.0,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["task_offloading"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["task_offloading"]
warn_unreachable = true
